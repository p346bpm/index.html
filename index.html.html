    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --highlight-bg: rgba(234, 179, 8, 0.25);
            --highlight-border: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .live-clock {
            background: #090d16;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .table-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #0b0f19;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
        }

        th, td {
            padding: 10px 14px;
            font-size: 0.78rem;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            text-align: center;
            white-space: pre-wrap;
            vertical-align: middle;
        }

        th {
            background-color: var(--panel-bg);
            color: var(--text-main);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* Coluna fixa de viaturas (Eixo Y) */
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background-color: var(--panel-bg);
            z-index: 10;
            font-weight: bold;
            text-align: left;
            width: 140px;
            min-width: 140px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
        }

        th:first-child {
            z-index: 30; /* Canto superior esquerdo fica por cima de tudo */
        }

        td {
            background-color: #131b2e;
            color: #cbd5e1;
            min-width: 150px;
            max-width: 180px;
            height: 65px;
        }

        tr:hover td {
            background-color: #17223b;
        }

        tr:hover td:first-child {
            background-color: #1e293b;
        }

        /* Destaque para a faixa horária atual */
        th.current-time-col {
            background-color: #713f12 !important;
            color: #fef08a !important;
            border-bottom: 3px solid #eab308;
        }

        td.current-time-col {
            background-color: var(--highlight-bg) !important;
            border-left: 2px solid var(--highlight-border);
            border-right: 2px solid var(--highlight-border);
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>

        function parseTime(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

                const [start, end] = times[i].split(' - ');
                const startMin = parseTime(start);
                const endMin = parseTime(end);

                if (currentMinutes >= startMin && currentMinutes <= endMin) {
                    return i;
                }
            }
            // Se estiver fora do horário, retorna -1
            return -1;
        }

        function buildTable() {
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');

            const activeIndex = getCurrentTimeIndex();

            // Criar colunas de cabeçalho
            times.forEach((t, index) => {
                const th = document.createElement('th');
                th.innerText = t;
                if (index === activeIndex) {
                    th.classList.add('current-time-col');
                }
                headerRow.appendChild(th);
            });

            // Criar linhas de viaturas
            units.forEach(unit => {
                const tr = document.createElement('tr');
                
                // Coluna fixa da viatura
                const tdUnit = document.createElement('td');
                tdUnit.innerText = unit;
                tr.appendChild(tdUnit);

                const unitSchedule = scheduleData[unit] || [];

                times.forEach((t, index) => {
                    const td = document.createElement('td');
                    td.innerText = unitSchedule[index] || "";
                    if (index === activeIndex) {
                        td.classList.add('current-time-col');
                    }
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });

            // Centralizar automaticamente na coluna atual ao carregar
            if (activeIndex !== -1) {
                setTimeout(() => {
                    const container = document.getElementById('scrollContainer');
                    const targetTh = headerRow.children[activeIndex + 1];
                    if (targetTh) {
                        container.scrollLeft = targetTh.offsetLeft - container.clientWidth / 2 + targetTh.clientWidth / 2;
                    }
                }, 100);
            }
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-display').innerText = `${hours}:${minutes}:${seconds}`;
        }

        buildTable();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
